[package]
name = "russet"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Renderer: default eframe features MINUS wgpu PLUS glow (OpenGL).
# Rationale: no in-process Vulkan/D3D driver (~3-5x lower RAM), and glow is the
# only renderer in egui 0.37 that supports TextureOptions::mipmap_mode.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
rfd = "0.15"
log = "0.4"
# MCP (owner request 2026-11-12): JSON-RPC stdio server behind the `mcp`
# feature — approved via "Dependencies — approval flow" in AGENTS.md. The
# dependency is OPTIONAL: the default build never compiles it and keeps its
# dependency graph byte-for-byte unchanged.
serde_json = { version = "1", optional = true }

# native (Windows):
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[features]
# MCP server (owner request 2026-11-12, chat-approved): compiles the in-tree
# MCP module (src/app/mcp.rs + children) that lets an AI agent drive the
# running app over stdin/stdout during development. Build with
# `cargo build --release --features mcp`; run with `--mcp` (or piped stdin).
# The default build compiles NONE of it: no MCP code, no threads, no
# serde_json in the dependency graph.
mcp = ["dep:serde_json"]

# FAST DEVELOPMENT:
# - own code rebuilds without optimizations (fast);
# - dependencies (eframe, wgpu, image...) are optimized ONCE and taken from cache —
#   the UI stays responsive in dev builds;
# - shorter debug info speeds up linking and barely loads the disk.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# GATES LANE (owner decision 2026-11-11): unoptimized builds for gate runs
# (verify.sh, agent sandboxes, weak/cold machines). Same checks as CI, minutes
# faster to compile — pure-logic tests never benefit from optimized deps.
#   cargo clippy --profile gates --all-targets -- -D warnings
#   cargo test --profile gates
[profile.gates]
inherits = "dev"
opt-level = 0
debug = false
incremental = false

[profile.gates.package."*"]
opt-level = 0

# Do NOT run `cargo build --release` until the user explicitly asks for it.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
