<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <title>Russet</title>

  <!-- Trunk entry point. `href` is resolved relative to THIS file, so the
       Cargo manifest one directory up is found from web/. Explicit link =
       no reliance on Trunk's automatic Cargo.toml discovery.
       `--all-features` is required: Trunk 0.22 runs wasm-opt on release
       builds, and its bundled wasm-opt 131 rejects the bulk-memory
       instructions Rust 1.99 emits unless the features are enabled. -->
  <link data-trunk rel="rust" href="../Cargo.toml" data-wasm-opt-params="--all-features" />

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%;
                 overflow: hidden; background: #1e1e1e; }
    #russet_canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading_text { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                    color: #cccccc; font-family: sans-serif; }
  </style>
</head>
<body>
  <!-- The id is hardcoded in src/main.rs (wasm entry point): keep both in sync. -->
  <canvas id="russet_canvas"></canvas>
  <div id="loading_text">Loading Russet…</div>
</body>
</html>
