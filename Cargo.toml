[package]
name = "russet"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Renderer: default eframe features MINUS wgpu PLUS glow (OpenGL).
# Rationale: no in-process Vulkan/D3D driver (~3-5x lower RAM), and glow is the
# only renderer in egui 0.37 that supports TextureOptions::mipmap_mode.
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
rfd = "0.15"
log = "0.4"
# MCP (owner request 2026-11-12): JSON-RPC stdio server behind the `mcp`
# feature — approved via "Dependencies — approval flow" in AGENTS.md. The
# dependency is OPTIONAL: the default build never compiles it and keeps its
# dependency graph byte-for-byte unchanged.
serde_json = { version = "1", optional = true }

# native (Windows):
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# Linux/Wayland CSD frame (owner request 2026-11-16): eframe enables only
# `winit/wayland`, so on Wayland winit falls back to sctk's FallbackFrame,
# whose `set_title` is a no-op and which has no double-click-to-maximize. On
# GNOME (Mutter draws no server-side decorations) the window gets a bare bar:
# no title text, double click does not maximize/unmaximize. This feature
# switches winit to AdwaitaFrame (title text, Adwaita buttons, double-click
# maximize with the GTK-like 400 ms threshold). Version matches the one
# eframe 0.37 / egui-winit 0.37 resolves (see Cargo.lock), so cargo unifies
# them into a single winit build. Inert outside Unix: winit gates
# sctk-adwaita by cfg(unix).
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
winit = { version = "0.30.13", features = ["wayland-csd-adwaita"] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

[features]
# MCP server (owner request 2026-11-12, chat-approved): compiles the in-tree
# MCP module (src/app/mcp.rs + children) that lets an AI agent drive the
# running app over stdin/stdout during development. Build with
# `cargo build --release --features mcp`; run with `--mcp` (or piped stdin).
# The default build compiles NONE of it: no MCP code, no threads, no
# serde_json in the dependency graph.
mcp = ["dep:serde_json"]

# TEMPORARY cross-platform diagnostics (owner OK 2026-11-16, debts F12/F13):
# compiles `[diagnostics]` stderr logging of (1) every wheel event — unit,
# source, raw delta → notches → the applied pan step, the F12-B calibration
# data — and (2) main-window resizes + floating-window repositions (F13). The
# DEFAULT build compiles NONE of it. Build with `--features diagnostics`:
#   cargo run --features diagnostics       (native; logs go to stderr)
#   trunk serve --features diagnostics     (web; logs go to the browser console)
# Removed together with the feature when F12/F13 close (the debts track it).
diagnostics = []

# FAST DEVELOPMENT:
# - own code rebuilds without optimizations (fast);
# - dependencies (eframe, wgpu, image...) are optimized ONCE and taken from cache —
#   the UI stays responsive in dev builds;
# - shorter debug info speeds up linking and barely loads the disk.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# GATES LANE (owner decision 2026-11-11): unoptimized builds for gate runs
# (verify.sh, agent sandboxes, weak/cold machines). Same checks as CI, minutes
# faster to compile — pure-logic tests never benefit from optimized deps.
#   cargo clippy --profile gates --all-targets -- -D warnings
#   cargo test --profile gates
[profile.gates]
inherits = "dev"
opt-level = 0
debug = false
incremental = false

[profile.gates.package."*"]
opt-level = 0

# Do NOT run `cargo build --release` until the user explicitly asks for it.
[profile.release]
lto = "fat"
codegen-units = 1
# NOT `strip = true` (owner request 2026-11-17): "symbols" maps to --strip-all,
# which deletes EVERY wasm custom section — including the `target_features`
# list rustc embeds so wasm-bindgen can detect the enabled Wasm features.
# With the section gone wasm-bindgen guesses and warns on every
# `trunk build --release` (silent mis-glue the day simd128/atomics land).
# `debuginfo` strips only DWARF (release `debug` is 0, so nothing extra) and
# keeps the custom sections; the final dist/ wasm is cut to size by wasm-opt
# AFTER wasm-bindgen anyway (trunk 0.22 runs it on every release build —
# web/index.html, PERF.md P5), so the bundle does not grow (PERF.md §1).
strip = "debuginfo"
